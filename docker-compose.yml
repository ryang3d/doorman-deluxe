services:
  doorman:
    image: doorman:local
    build: .
    container_name: doorman
    # host networking: aiortc/WebRTC talks UDP to go2rtc (Frigate :8555) and the
    # doorbell RTSP (:554); bridge networking breaks media. Requires Linux.
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - doorman_snapshots:/snapshots
      - ./tmp:/tmp  # debug captures (DOORMAN_LOCAL_DEBUG_CAPTURE)
      - doorman_data:/data  # transcripts + session snapshots (DOORMAN_DATA_DIR)
      - ./.env:/app/.env  # UI reads/writes the host .env live
    environment:
      # must match the mounted volume path
      DOORMAN_SNAPSHOT_DIR: /snapshots
      # Household timezone (Los Angeles). Drives date/logging/strftime inside the
      # container so timestamps read local. The web UI additionally renders every
      # timestamp in this zone explicitly (src/ui/app.js HOUSE_TZ), so the history
      # view shows unambiguous "when it happened" times regardless of the viewer.
      TZ: America/Los_Angeles

  # faster-whisper STT service (the STT doorman uses). POST /transcribe on :10302;
  # doorman reaches it at 127.0.0.1:10302 via DOORMAN_STT_BASE_URL. (Parakeet on
  # :10301 was the original A/B candidate; superseded 2026-10 and removed.)
  whisper:
    image: ghcr.io/ryang3d/doorman-deluxe-stt:latest
    build:
      context: .
      dockerfile: deploy/whisper.Dockerfile
    container_name: whisper-stt
    profiles:
      - stt
    restart: unless-stopped
    network_mode: host
    environment:
      WHISPER_MODEL: small.en
      WHISPORT: "10302"
    volumes:
      - whisper_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  doorman_snapshots:
  doorman_data:
  whisper_models:
