services:
  doorman:
    image: doorman:local
    build: .
    container_name: doorman
    # host networking: aiortc/WebRTC talks UDP to go2rtc (Frigate :8555) and the
    # doorbell RTSP (:554); bridge networking breaks media. Requires Linux.
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - doorman_snapshots:/snapshots
      - ./tmp:/tmp  # debug captures (DOORMAN_LOCAL_DEBUG_CAPTURE)
      - doorman_data:/data  # transcripts + session snapshots (DOORMAN_DATA_DIR)
      - ./.env:/app/.env  # UI reads/writes the host .env live
    environment:
      # must match the mounted volume path
      DOORMAN_SNAPSHOT_DIR: /snapshots
      # Household timezone (Los Angeles). Drives date/logging/strftime inside the
      # container so timestamps read local. The web UI additionally renders every
      # timestamp in this zone explicitly (src/ui/app.js HOUSE_TZ), so the history
      # view shows unambiguous "when it happened" times regardless of the viewer.
      TZ: America/Los_Angeles

  # Standalone Parakeet TDT 0.6B v3 STT. POST /transcribe on 10301.
  # ON-DEMAND: doorman runs whisper (:10302), so this stays stopped for GPU
  # headroom. To A/B against whisper: docker compose up -d parakeet, then flip
  # DOORMAN_STT_BASE_URL=http://127.0.0.1:10301 and recreate doorman.
  # network_mode: host so the doorman container reaches it at 127.0.0.1:10301.
  parakeet:
    image: doorman-parakeet:local
    build:
      context: .
      dockerfile: deploy/parakeet.Dockerfile
    container_name: parakeet-stt
    restart: unless-stopped
    network_mode: host
    environment:
      PARAKEET_MODEL: nvidia/parakeet-tdt-0.6b-v3
    volumes:
      - parakeet_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # faster-whisper STT service (A/B candidate to replace Parakeet). Drop-in: same
  # POST /transcribe -> {"text","language","seconds"} contract, but on :10302 so it
  # coexists with Parakeet (:10301) during A/B. Doorman points at it via
  # DOORMAN_STT_BASE_URL=http://127.0.0.1:10302.
  whisper:
    image: doorman-whisper:local
    build:
      context: .
      dockerfile: deploy/whisper.Dockerfile
    container_name: whisper-stt
    restart: unless-stopped
    network_mode: host
    environment:
      WHISPER_MODEL: small.en
      WHISPORT: "10302"
    volumes:
      - whisper_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  doorman_snapshots:
  doorman_data:
  parakeet_models:
  whisper_models:
