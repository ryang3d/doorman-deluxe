<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- doorbell-camera body: dark rounded panel (tall) -->
  <rect x="14" y="4" width="36" height="56" rx="10" fill="#1f2937"/>
  <rect x="14" y="4" width="36" height="56" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- camera lens (top) -->
  <circle cx="32" cy="20" r="12" fill="#111827" stroke="#4b5563" stroke-width="2"/>
  <circle cx="32" cy="20" r="6" fill="#0ea5e9"/>
  <circle cx="29" cy="17" r="2" fill="#e0f2fe"/>
  <!-- doorbell button (bottom) with illuminated ring light -->
  <circle cx="32" cy="45" r="11" fill="none" stroke="#fef3c7" stroke-width="3"/>
  <circle cx="32" cy="45" r="7.5" fill="#f59e0b"/>
  <circle cx="32" cy="45" r="3" fill="#fff7ed"/>
</svg>
