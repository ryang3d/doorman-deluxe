<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoormanDX</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot" id="status-dot"></span><span class="brand-name">Doorman<sup class="brand-dx">DX</sup></span></div>
  <nav class="tabs" id="tabs">
    <a href="#dashboard" data-tab="dashboard">Dashboard</a>
    <a href="#history" data-tab="history">History</a>
    <a href="#prompts" data-tab="prompts">Prompts</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>
  <div class="top-status" id="top-status"></div>
</header>
<main id="view" aria-live="polite"></main>
<footer class="footer" id="footer"></footer>
<div id="toast" class="toast" hidden></div>
<noscript><div class="noscript">Doorman UI requires JavaScript.</div></noscript>
<script src="/app.js"></script>
</body>
</html>
